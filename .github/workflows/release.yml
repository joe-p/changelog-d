name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Record base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Merge pending fragments
        run: node dist/cli.js generate

      - name: Check for an unreleased section
        id: unreleased
        run: |
          if grep -qE '^# .*UNRELEASED' CHANGELOG.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Finalize release
        id: release
        if: steps.unreleased.outputs.found == 'true'
        run: |
          node dist/cli.js release
          version="$(node dist/cli.js latest)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bump package.json version
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Commit and tag
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
          else
            git commit -m "chore: release v${VERSION} [skip ci]"
          fi
          git push origin HEAD:main
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists."
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Create GitHub release
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists."
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes "$(node dist/cli.js notes)"
          fi

      - name: Stage npm publish
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "semfrag@${VERSION}" version >/dev/null 2>&1; then
            echo "semfrag@${VERSION} is already published."
          else
            npm stage publish --access public
          fi

      - name: Roll back failed release
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$VERSION" ]; then
            echo "Deleting GitHub release and tag v${VERSION}..."
            gh release delete "v${VERSION}" --yes --cleanup-tag 2>/dev/null || true
            git push origin ":refs/tags/v${VERSION}" 2>/dev/null || true
          fi

          if [ -n "$BASE_SHA" ] && [ "$(git rev-parse HEAD)" != "$BASE_SHA" ]; then
            echo "Restoring main to ${BASE_SHA}..."
            git push origin "+${BASE_SHA}:refs/heads/main"
          fi
